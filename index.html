<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a63d22"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Mon Maquis</title>
<style>
:root{--bg:#eceee9;--cd:#fff;--tx:#1f1d1a;--mu:#6c6a63;--pr:#a63d22;--on:#fff;--ok:#2f7d4f;--ko:#c23a2a;--bd:#d9dbd3;--ac:#e0a526}
@media(prefers-color-scheme:dark){:root{--bg:#161816;--cd:#212421;--tx:#ecebe6;--mu:#9b9a92;--pr:#e2744f;--on:#1a0e09;--ok:#5fc08a;--ko:#ef7466;--bd:#323631}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 calc(150px + env(safe-area-inset-bottom,0))}
#app{max-width:640px;margin:0 auto;padding:14px}
h2{font:700 24px/1.2 Georgia,"Times New Roman",serif;margin:6px 0 14px}
h3{font-size:16px;margin:18px 0 8px}
small{display:block;color:var(--mu);font-size:13px}
.mu{color:var(--mu)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--pr);color:var(--on);cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.w{width:100%;margin:6px 0}
button.x{background:none;color:var(--ko);padding:8px 10px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
input,select{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx)}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 0}
label input,label select{margin-top:4px;color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.r{display:flex;align-items:center;gap:10px;background:var(--cd);border-bottom:1px solid var(--bd);padding:10px 12px}
.r:first-of-type{border-radius:12px 12px 0 0}.r:last-child{border-radius:0 0 12px 12px;border-bottom:0}
.r.dim{opacity:.55}
.g{flex:1;min-width:0}
.q{display:flex;align-items:center;gap:6px}
.q button{width:40px;padding:10px 0}
.q span{min-width:24px;text-align:center;font-weight:700}
.st{font:700 20px Georgia,serif;min-width:40px;text-align:right}
.st.lo{color:var(--ko)}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.chips button{background:var(--cd);color:var(--tx);border:1px solid var(--bd);padding:8px 14px;white-space:nowrap}
.chips button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.big{font:700 34px/1.1 Georgia,serif}
.pos{color:var(--ok)}.neg{color:var(--ko)}
.ln{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd)}
.ln:last-child{border:0}
.warn{background:var(--ac);color:#241a00;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600}
#cb{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0));padding:0 10px}
.cb{max-width:640px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.cb>div{flex:1}
.cb .sec{color:var(--bg);border-color:#888}
.cb{flex-wrap:wrap}.cb select{width:auto;padding:8px;border-color:#888}.cb .py{flex-basis:100%;display:flex;align-items:center;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px 2px;font-size:13px}
nav button.on{color:var(--pr);box-shadow:inset 0 3px 0 var(--pr)}
#m{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
#m[hidden]{display:none}
.mb{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0))}
</style></head>
<body>
<div id="app"></div><div id="cb"></div>
<nav>
<button data-t="v" onclick="go('v')">Vente</button>
<button data-t="s" onclick="go('s')">Stock</button>
<button data-t="a" onclick="go('a')">Achats</button>
<button data-t="l" onclick="go('l')">Pertes</button>
<button data-t="b" onclick="go('b')">Bilan</button>
</nav>
<div id="m" hidden><div class="mb"></div></div>
<script>
const K='maquis_v1';
const FMT={"Bière":["Canette","Petite bouteille","Grande bouteille"],"Boisson sucrée":["Canette","Petite bouteille","Grande bouteille"],"Jus":["Canette","Petite bouteille","Grande bouteille","Verre"],"Vin":["Bouteille","Verre"],"Liqueur":["Petite bouteille","Grande bouteille","Verre"],"Repas":["Plat","Demi-plat","Portion"],"Autre":["Unité"]};
const PAY=["Cash","Orange Money","Moov Money"];
const payOpt=v=>PAY.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');
const RAIS=["Casse","Périmé ou gâté","Offert","Manque ou vol","Autre"];
let D={p:[],a:[],v:[],l:[],bk:0},db=null,pend=null,tab='v',cart={},per='j',q='',py='Cash';
const old0=()=>{try{const o=JSON.parse(localStorage.getItem(K));return o&&o.p?o:null}catch(e){return null}};
function idb(){return new Promise((ok,ko)=>{const r=indexedDB.open('maquis',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})}
async function boot(){try{db=await idb();const d=await new Promise((ok,ko)=>{const r=db.transaction('k').objectStore('k').get('d');r.onsuccess=()=>ok(r.result);r.onerror=ko});
if(d)D=d;else{const o=old0();if(o){D=o;save()}}}catch(e){db=null;const o=old0();if(o)D=o}render()}
function esp(){const s=navigator.storage;if(!s||!s.estimate)return;Promise.all([s.estimate(),s.persisted?s.persisted():0]).then(([e,p])=>{const el=$('#esp');if(el)el.textContent='Espace utilisé : '+Math.round(e.usage/1024)+' Ko. Protection contre l’effacement automatique : '+(p?'active':'non garantie')+'.'}).catch(()=>{})}
function save(){const bad=()=>alert('Impossible d’enregistrer les données sur ce téléphone.');
if(!db){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){bad()}return}
const t=db.transaction('k','readwrite');t.objectStore('k').put(D,'d');t.onerror=t.onabort=bad}
const $=s=>document.querySelector(s);
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=n=>Math.round(n).toLocaleString('fr-FR')+' F';
const dt=t=>new Date(t).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const P=id=>D.p.find(x=>x.id===id);
function stocks(){const S={};D.p.forEach(p=>S[p.id]=0);D.a.forEach(a=>S[a.p]+=a.q);D.v.forEach(v=>v.L.forEach(i=>S[i.p]-=i.q));D.l.forEach(l=>S[l.p]-=l.q);return S}
function go(t){tab=t;render();scrollTo(0,0)}
function render(){const S=stocks();$('#app').innerHTML=({v:vVente,s:vStock,a:vAchat,l:vPerte,b:vBilan})[tab](S);
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
$('#cb').innerHTML=tab==='v'?cartBar():'';if(tab==='a'){acf();apf()}if(tab==='b')esp()}
function modal(h){$('#m .mb').innerHTML=h;$('#m').hidden=false}
function cm(){$('#m').hidden=true}
const tel=v=>/^\+?\d{8,15}$/.test(v);
const num=id=>{const v=$(id).value;return v===''?NaN:+v};

/* VENTE */
function rowsV(S){const f=q.toLowerCase();return D.p.filter(p=>!p.x&&(p.n+' '+p.t+' '+p.f).toLowerCase().includes(f)).map(p=>{const n=cart[p.id]||0,s=S[p.id];
return `<div class="r${s<=0?' dim':''}"><div class="g"><b>${E(p.n)}</b><small>${E(p.t)}, ${E(p.f)}</small><small>${m(p.s)} • en stock : ${s}</small></div><div class="q"><button class="sec" onclick="ct('${p.id}',-1)">−</button><span>${n}</span><button onclick="ct('${p.id}',1)">+</button></div></div>`}).join('')||'<p class="mu">Aucun produit. Ajoute tes produits dans l’onglet Stock.</p>'}
function vVente(S){return `<h2>Nouvelle vente</h2><input type="search" placeholder="Chercher un produit" value="${E(q)}" oninput="q=this.value;upV()"><div id="lst" style="margin-top:10px">${rowsV(S)}</div>`}
function cartBar(){let t=0,c=0;for(const id in cart){t+=cart[id]*P(id).s;c+=cart[id]}
return c?`<div class="cb"><div>${c} article(s)<br><b>${m(t)}</b></div><button class="sec" onclick="cart={};upV()">Vider</button><button onclick="pay()">Valider</button></div>`:''}
function upV(){$('#lst').innerHTML=rowsV(stocks());$('#cb').innerHTML=cartBar()}
function ct(id,d){const s=stocks()[id],n=(cart[id]||0)+d;if(d>0&&n>s)return alert('Stock insuffisant : il en reste '+s+'.');if(n<=0)delete cart[id];else cart[id]=n;upV()}
function pay(){let t=0;for(const id in cart)t+=cart[id]*P(id).s;
modal(`<h3>Finaliser la vente</h3><div class="big">${m(t)}</div><label>Payé en<select id="sy" onchange="py=this.value;spf()">${payOpt(py)}</select></label><label>Numéro du reçu<input id="src"></label><div id="stc"></div><div class="two" style="margin-top:14px"><button class="sec" onclick="cm()">Retour</button><button onclick="sell()">Enregistrer la vente</button></div>`);spf()}
function spf(){$('#stc').innerHTML=py==='Cash'?'':'<label>Téléphone du client (numéro qui a transféré)<input id="stl" type="tel" inputmode="tel"></label>'}
function sell(){const rc=$('#src').value.trim(),tc=py==='Cash'?'':$('#stl').value.replace(/\s/g,'');
if(!rc)return alert('Entre le numéro du reçu.');if(py!=='Cash'&&!tel(tc))return alert('Entre le numéro de téléphone du client (8 chiffres ou plus).');
const S=stocks(),L=[];for(const id in cart){const p=P(id);if(cart[id]>S[id])return alert('Stock insuffisant pour '+p.n);L.push({p:id,q:cart[id],pr:p.s,c:p.b})}
if(!L.length)return;D.v.push({id:uid(),t:Date.now(),L,y:py,rc,tc});cart={};save();cm();render()}

/* STOCK */
function vStock(S){const A=D.p.filter(p=>!p.x),X=D.p.filter(p=>p.x);
const row=p=>`<div class="r${p.x?' dim':''}" onclick="pf('${p.id}')"><div class="g"><b>${E(p.n)}</b><small>${E(p.t)}, ${E(p.f)}${p.x?' (archivé)':''}</small><small>Achat ${m(p.b)} • Vente ${m(p.s)} • Gain ${m(p.s-p.b)}</small></div><div class="st${S[p.id]<=p.min&&!p.x?' lo':''}">${S[p.id]}</div></div>`;
const val=A.reduce((t,p)=>t+S[p.id]*p.b,0);
return `<h2>Stock</h2><button class="w" onclick="pf()">+ Nouveau produit</button>`+(A.length?`<div style="margin-top:8px">${A.map(row).join('')}</div><p class="mu">Valeur du stock au prix d’achat : <b>${m(val)}</b>. Les quantités en rouge ont atteint le seuil d’alerte.</p>`:'<p class="mu">Aucun produit pour l’instant.</p>')+(X.length?`<h3>Produits archivés</h3><div>${X.map(row).join('')}</div>`:'')}
function pf(id){const p=id?P(id):{n:'',t:'Bière',f:'',b:'',s:'',min:5};
modal(`<h3>${id?'Modifier le produit':'Nouveau produit'}</h3>
<label>Nom<input id="fn" value="${E(p.n)}" placeholder="ex : Brakina, Coca, Riz gras"></label>
<label>Type<select id="ft" onchange="fl()">${Object.keys(FMT).map(t=>`<option${t===p.t?' selected':''}>${t}</option>`).join('')}</select></label>
<label>Conditionnement<select id="ff"></select></label>
<div class="two"><label>Prix d’achat<input id="fb" type="number" inputmode="decimal" min="0" value="${p.b}"></label><label>Prix de vente<input id="fs" type="number" inputmode="decimal" min="0" value="${p.s}"></label></div>
<label>Alerte stock bas (quand il en reste ce nombre ou moins)<input id="fm" type="number" inputmode="numeric" min="0" value="${p.min}"></label>
${id?'':'<label>Quantité déjà en stock<input id="fi" type="number" inputmode="numeric" min="0" value="0"></label>'}
<div class="two" style="margin-top:14px"><button class="sec" onclick="cm()">Annuler</button><button onclick="ps('${id||''}')">Enregistrer</button></div>
${id?`<button class="sec w" onclick="pa('${id}')">${p.x?'Réactiver':'Archiver'} ce produit</button>`:''}`);fl(p.f)}
function fl(f){$('#ff').innerHTML=FMT[$('#ft').value].map(x=>`<option${x===f?' selected':''}>${x}</option>`).join('')}
function ps(id){const n=$('#fn').value.trim(),b=num('#fb'),s=num('#fs'),mn=num('#fm')||0;
if(!n)return alert('Donne un nom au produit.');if(isNaN(b)||isNaN(s)||b<0||s<0)return alert('Renseigne le prix d’achat et le prix de vente.');
if(s<b&&!confirm('Le prix de vente est plus bas que le prix d’achat : chaque vente sera une perte. Continuer ?'))return;
const o={n,t:$('#ft').value,f:$('#ff').value,b,s,min:mn};
if(id)Object.assign(P(id),o);else{const p={id:uid(),...o};D.p.push(p);const i=Math.floor(num('#fi'))||0;if(i>0)D.a.push({id:uid(),t:Date.now(),p:p.id,q:i,c:b,init:1})}
save();cm();render()}
function pa(id){const p=P(id);p.x=p.x?0:1;save();cm();render()}

/* ACHATS */
const opts=S=>D.p.filter(p=>!p.x).map(p=>`<option value="${p.id}">${E(p.n)} (${E(p.f)}), stock ${S[p.id]}</option>`).join('');
function vAchat(S){return `<h2>Achats</h2>`+(D.p.some(p=>!p.x)?`<div class="card"><label>Produit<select id="ap" onchange="acf()">${opts(S)}</select></label><div class="two"><label>Quantité reçue<input id="aq" type="number" inputmode="numeric" min="1"></label><label>Prix d’achat unitaire<input id="apc" type="number" inputmode="decimal" min="0"></label></div><label>Payé par<select id="apy" onchange="apf()">${payOpt('Cash')}</select></label><div id="apx"></div><button class="w" onclick="addA()">Enregistrer l’achat</button></div>`:'<p class="mu">Crée d’abord un produit dans l’onglet Stock.</p>')+'<h3>Derniers achats</h3><div>'+(D.a.filter(a=>!a.init).slice(-30).reverse().map(a=>`<div class="r"><div class="g"><b>${E(P(a.p).n)}</b><small>${dt(a.t)} • ${a.q} × ${m(a.c)} • ${E(a.y||'Cash')}${a.sn?' • '+E(a.sn):''}</small></div><b>${m(a.q*a.c)}</b><button class="x" onclick="delA('${a.id}')">✕</button></div>`).join('')||'<p class="mu">Aucun achat enregistré.</p>')+'</div>'}
function apf(){const y=$('#apy');if(!y)return;const o=$('#asn')?$('#asn').value:'',nm=[...new Set(D.a.map(a=>a.sn).filter(Boolean))];
$('#apx').innerHTML=`<datalist id="fr">${nm.map(n=>`<option value="${E(n)}">`).join('')}</datalist><label>Nom de la structure qui a reçu<input id="asn" list="fr"></label>`+(y.value!=='Cash'?`<div class="two"><label>Numéro qui a envoyé<input id="ate" type="tel" inputmode="tel" value="${E(D.tel||'')}"></label><label>Numéro qui a reçu<input id="atr" type="tel" inputmode="tel"></label></div>`:'');$('#asn').value=o}
function acf(){const s=$('#ap');if(s)$('#apc').value=P(s.value).b}
function addA(){const p=P($('#ap').value),n=num('#aq'),c=num('#apc');
if(!(n>0)||n!==Math.floor(n))return alert('Entre une quantité entière supérieure à 0.');if(isNaN(c)||c<0)return alert('Entre le prix d’achat unitaire.');
const y=$('#apy').value,sn=$('#asn').value.trim(),te=y==='Cash'?'':$('#ate').value.replace(/\s/g,''),tr=y==='Cash'?'':$('#atr').value.replace(/\s/g,'');
if(!sn)return alert('Entre le nom de la structure qui a reçu l’argent.');if(y!=='Cash'&&!(tel(te)&&tel(tr)))return alert('Entre les deux numéros de téléphone (8 chiffres ou plus).');
pend={p,n,c,y,sn,te,tr};if(c===p.b)return fin(0);
modal(`<h3>Le prix d’achat a changé</h3><p class="mu">${E(p.n)} : ${m(p.b)} → <b>${m(c)}</b> l’unité. Prix de vente actuel : ${m(p.s)}, soit un gain de ${m(p.s-c)} par unité avec le nouveau prix d’achat.</p><label>Prix de vente (modifie-le si tu veux)<input id="nps" type="number" inputmode="decimal" min="0" value="${p.s}"></label><button class="w" onclick="fin(1)">Mettre à jour la fiche</button><button class="sec w" onclick="fin(0)">Garder les anciens prix</button><button class="sec w" onclick="pend=null;cm()">Annuler l’achat</button>`)}
function fin(u){const x=pend;if(!x)return;if(u){const v=num('#nps');if(isNaN(v)||v<0)return alert('Entre le prix de vente.');if(v<x.c&&!confirm('Le prix de vente est plus bas que le prix d’achat : chaque vente sera une perte. Continuer ?'))return;x.p.b=x.c;x.p.s=v}
D.a.push({id:uid(),t:Date.now(),p:x.p.id,q:x.n,c:x.c,y:x.y,sn:x.sn,te:x.te,tr:x.tr});if(x.te)D.tel=x.te;pend=null;save();cm();render()}
function delA(id){const a=D.a.find(x=>x.id===id);if(stocks()[a.p]-a.q<0)return alert('Impossible : une partie de cet achat est déjà vendue ou perdue.');
if(confirm('Supprimer cet achat ? Le stock diminuera de '+a.q+'.')){D.a=D.a.filter(x=>x!==a);save();render()}}

/* PERTES */
function vPerte(S){return `<h2>Pertes</h2><p class="mu">Casse, produit périmé, boisson offerte, manque. Le stock baisse et la perte est comptée au prix d’achat.</p>`+(D.p.some(p=>!p.x)?`<div class="card"><label>Produit<select id="lp">${opts(S)}</select></label><div class="two"><label>Quantité perdue<input id="lq" type="number" inputmode="numeric" min="1"></label><label>Raison<select id="lr">${RAIS.map(r=>`<option>${r}</option>`).join('')}</select></label></div><button class="w" onclick="addL()">Enregistrer la perte</button></div>`:'')+'<h3>Dernières pertes</h3><div>'+(D.l.slice(-30).reverse().map(l=>`<div class="r"><div class="g"><b>${E(P(l.p).n)}</b><small>${dt(l.t)} • ${l.q} • ${E(l.r)}</small></div><b class="neg">−${m(l.q*l.c)}</b><button class="x" onclick="delL('${l.id}')">✕</button></div>`).join('')||'<p class="mu">Aucune perte enregistrée.</p>')+'</div>'}
function addL(){const p=P($('#lp').value),n=num('#lq');if(!(n>0)||n!==Math.floor(n))return alert('Entre une quantité entière supérieure à 0.');
if(n>stocks()[p.id])return alert('Tu ne peux pas perdre plus que le stock disponible.');
D.l.push({id:uid(),t:Date.now(),p:p.id,q:n,c:p.b,r:$('#lr').value});save();render()}
function delL(id){if(confirm('Supprimer cette perte ? Le stock remontera.')){D.l=D.l.filter(x=>x.id!==id);save();render()}}

/* BILAN */
function since(){if(per==='t')return 0;const d=new Date();d.setHours(0,0,0,0);if(per==='s')d.setDate(d.getDate()-6);if(per==='m')d.setDate(1);return d.getTime()}
function vBilan(S){const s0=since(),V=D.v.filter(v=>v.t>=s0),A=D.a.filter(a=>a.t>=s0&&!a.init),Lo=D.l.filter(l=>l.t>=s0);
let ca=0,cg=0;V.forEach(v=>v.L.forEach(i=>{ca+=i.q*i.pr;cg+=i.q*i.c}));
const pe=Lo.reduce((t,l)=>t+l.q*l.c,0),ach=A.reduce((t,a)=>t+a.q*a.c,0),mb=ca-cg,net=mb-pe,low=D.p.filter(p=>!p.x&&S[p.id]<=p.min);
const pv={},pw={};V.forEach(v=>{const y=v.y||'Cash';pv[y]=(pv[y]||0)+v.L.reduce((a,i)=>a+i.q*i.pr,0)});A.forEach(a=>{const y=a.y||'Cash';pw[y]=(pw[y]||0)+a.q*a.c});
const old=!D.bk||Date.now()-D.bk>7*864e5;
const ch=[['j','Aujourd’hui'],['s','7 jours'],['m','Ce mois'],['t','Tout']];
const ln=(a,b,c)=>`<div class="ln"><span>${a}</span><b${c?` class="${c}"`:''}>${b}</b></div>`;
return `<h2>Bilan</h2>${old?'<div class="warn">Pense à faire une sauvegarde de tes données (en bas de cette page).</div>':''}
<div class="chips">${ch.map(c=>`<button class="${per===c[0]?'on':''}" onclick="per='${c[0]}';render()">${c[1]}</button>`).join('')}</div>
<div class="card"><small>Bénéfice net</small><div class="big ${net<0?'neg':'pos'}">${m(net)}</div><small>Ventes − coût des produits vendus − pertes</small></div>
<div class="card">${ln('Ventes ('+V.length+')',m(ca))}${ln('Coût des produits vendus','−'+m(cg))}${ln('Marge sur ventes',m(mb),mb<0?'neg':'')}${ln('Pertes','−'+m(pe),pe?'neg':'')}</div>
<div class="card"><small>Argent encaissé (ventes)</small>${PAY.map(y=>ln(y,m(pv[y]||0))).join('')}<small style="margin-top:10px">Argent dépensé (achats)</small>${PAY.map(y=>ln(y,m(pw[y]||0))).join('')}</div>
<div class="card">${ln('Achats de la période',m(ach))}${ln('Valeur du stock actuel',m(D.p.reduce((t,p)=>t+S[p.id]*p.b,0)))}<small>Un achat n’est pas une dépense perdue : il remplit le stock. Il ne réduit le bénéfice que lorsque le produit est vendu ou perdu.</small></div>
${low.length?`<h3>Stock bas</h3><div>${low.map(p=>`<div class="r"><div class="g"><b>${E(p.n)}</b><small>${E(p.f)}</small></div><div class="st lo">${S[p.id]}</div></div>`).join('')}</div>`:''}
<h3>Ventes de la période</h3><div>${V.slice(-40).reverse().map(v=>{const t=v.L.reduce((a,i)=>a+i.q*i.pr,0);return `<div class="r"><div class="g"><b>${m(t)}</b><small>${dt(v.t)} • ${E(v.y||'Cash')}${v.rc?' • reçu '+E(v.rc):''}${v.tc?' • '+E(v.tc):''} • ${v.L.map(i=>i.q+' '+E(P(i.p).n)).join(', ')}</small></div><button class="x" onclick="delV('${v.id}')">✕</button></div>`}).join('')||'<p class="mu">Aucune vente sur cette période.</p>'}</div>
<h3>Rapport à lire</h3><p class="mu">Un texte simple avec le résumé, le stock, les ventes, les achats et les pertes de la période choisie ci-dessus.</p><button class="w" onclick="rap()">Télécharger le rapport (.txt)</button>${navigator.share?'<button class="sec w" onclick="shr()">Envoyer le rapport (WhatsApp…)</button>':''}
<h3>Sauvegarde des données</h3><p class="mu">Ce fichier n’est pas fait pour être lu : il sert seulement à tout restaurer si tu perds tes données.</p><button class="w" onclick="exp()">Sauvegarder (pour restaurer)</button>
<button class="sec w" onclick="$('#fi2').click()">Restaurer une sauvegarde</button><input id="fi2" type="file" accept=".json" hidden onchange="imp(event)">
<button class="sec w" onclick="rst()">Tout effacer</button>
<p class="mu">Dernière sauvegarde : ${D.bk?dt(D.bk):'jamais'}. Les données sont gardées uniquement sur ce téléphone : ne vide pas les données de ton navigateur sans sauvegarde.</p><p class="mu" id="esp"></p>`}
function delV(id){if(confirm('Annuler cette vente ? Les articles reviennent en stock.')){D.v=D.v.filter(x=>x.id!==id);save();render()}}
function txt(){const S=stocks(),s0=since(),V=D.v.filter(v=>v.t>=s0),A=D.a.filter(a=>a.t>=s0&&!a.init),Lo=D.l.filter(l=>l.t>=s0);
const mt=n=>m(n).replace(/[\u202f\u00a0]/g,' '),ln=(a,b)=>a.padEnd(26,'.')+' '+b;
let ca=0,cg=0;const pv={},pw={};
V.forEach(v=>{const y=v.y||'Cash';v.L.forEach(i=>{ca+=i.q*i.pr;cg+=i.q*i.c;pv[y]=(pv[y]||0)+i.q*i.pr})});
A.forEach(a=>{const y=a.y||'Cash';pw[y]=(pw[y]||0)+a.q*a.c});
const pe=Lo.reduce((t,l)=>t+l.q*l.c,0),nm={j:'Aujourd’hui',s:'7 derniers jours',m:'Ce mois',t:'Tout'}[per];
const T=['RAPPORT MON MAQUIS','Période : '+nm,'Édité le '+dt(Date.now()),'','RÉSUMÉ',ln('Ventes',mt(ca)),ln('Coût des produits',mt(cg)),ln('Marge sur ventes',mt(ca-cg)),ln('Pertes',mt(pe)),ln('BÉNÉFICE NET',mt(ca-cg-pe)),'','ARGENT ENCAISSÉ',...PAY.map(y=>ln(y,mt(pv[y]||0))),'','ARGENT DÉPENSÉ (ACHATS)',...PAY.map(y=>ln(y,mt(pw[y]||0))),'','STOCK ACTUEL',...D.p.filter(p=>!p.x).map(p=>'- '+p.n+' ('+p.f+') : '+S[p.id]+(S[p.id]<=p.min?'  <- STOCK BAS':'')),
'','VENTES ('+V.length+')',...V.map(v=>dt(v.t)+' | '+(v.y||'Cash')+(v.rc?' | reçu '+v.rc:'')+(v.tc?' | tél '+v.tc:'')+' | '+v.L.map(i=>i.q+' '+P(i.p).n).join(', ')+' | '+mt(v.L.reduce((a,i)=>a+i.q*i.pr,0))),
'','ACHATS ('+A.length+')',...A.map(a=>dt(a.t)+' | '+(a.y||'Cash')+(a.sn?' | '+a.sn:'')+(a.te?' | de '+a.te+' vers '+a.tr:'')+' | '+a.q+' '+P(a.p).n+' x '+mt(a.c)+' = '+mt(a.q*a.c)),
'','PERTES ('+Lo.length+')',...Lo.map(l=>dt(l.t)+' | '+l.q+' '+P(l.p).n+' | '+l.r+' | '+mt(l.q*l.c))];
return T.join('\n')}
function rap(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt()],{type:'text/plain;charset=utf-8'}));a.download='maquis-rapport-'+new Date().toISOString().slice(0,10)+'.txt';a.click()}
function shr(){navigator.share({title:'Rapport Mon Maquis',text:txt()}).catch(()=>{})}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='maquis-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();D.bk=Date.now();save();render()}
function imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.p||!d.a||!d.v||!d.l)throw 0;if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;D=d;save();render()}catch(x){alert('Ce fichier n’est pas une sauvegarde valide.')}};r.readAsText(f)}
function rst(){if(confirm('Effacer toutes les données ?')&&confirm('Vraiment tout effacer ? C’est irréversible.')){D={p:[],a:[],v:[],l:[],bk:0};cart={};save();render()}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
